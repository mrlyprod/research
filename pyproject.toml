[project]
name = "mrly-research"
version = "0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5",
    "sympy>=1.14",
    "mpmath>=1.3",
    "scipy>=1.18",
    "pillow>=12",
    "torch>=2.14.1",
]

[dependency-groups]
mrly = [
    "mrly-core",
    "mrly-font",
    "mrly-life",
    "mrly-math",
    "mrly-num",
    "mrly-tile",
]

[tool.uv]
package = false

[tool.uv.sources]
mrly-core = { path = "../core/py" }
mrly-font = { path = "../font/py" }
mrly-life = { path = "../life/py" }
mrly-math = { path = "../math/py" }
mrly-num = { path = "../num/py" }
mrly-tile = { path = "../tile/py" }

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["B023", "BLE001", "UP031"]
